<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts</title>
    <link rel="stylesheet" href="{{url_for('static', filename='view_user_posts.css')}}">
</head>

<body>
    <div id="navbar">
        <div id="back-container">
            <a href="javascript:history.back()">
              <img src="{{ url_for('static', filename='icons/turn-back.png')}}">
            </a>
        </div>

        <h3>{{ username }} POSTS</h3>
        <hr>
    </div>

    <div id="posts-container">

        {% for post in posts %}

        <div class="post">

            <div class="posts-layout"></div>

            <img
                class="post-image"
                src="{{ url_for(
                'static',
                filename='users/' + username + '/' + post['post']
            ) }}">

            <p>{{ post['caption'] }}</p>

        </div>

        {% endfor %}

    </div>

</body>
</html>
