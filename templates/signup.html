<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="{{url_for('static', filename='signup.css')}}">
</head>
<body>

    <div class="container">
        <div class="avatar">
            <svg viewBox="0 0 24 24"><path d="M15 12c1.9 0 3.4-1.6 3.4-3.5S16.9 5 15 5s-3.5 1.6-3.5 3.5S13.1 12 15 12zm-6.5-1c1.4 0 2.5-1.1 2.5-2.5S9.9 6 8.5 6 6 7.1 6 8.5 7.1 11 8.5 11zM15 13.5c-2.3 0-7 1.2-7 3.5v2h14v-2c0-2.3-4.7-3.5-7-3.5zm-6.5.7c-.5-.1-1-.2-1.5-.2-2.3 0-7 1.2-7 3.5v1.5h6v-1.4c0-1.3.6-2.5 2.5-3.4z"/></svg>
        </div>
        <h2 id="title">Create Account</h2>
        <p class="subtitle">Join us — it only takes a minute</p>

        <form method="POST">
            <div class="input-group">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="input-group">
                <svg viewBox="0 0 24 24"><path d="M17 8V7a5 5 0 0 0-10 0v1H5v13h14V8h-2zM9 7a3 3 0 0 1 6 0v1H9V7zm5 8.7V18h-4v-2.3a2 2 0 1 1 4 0z"/></svg>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit">Create Account</button>

            <div class="divider">Already have an account?</div>

            <p class="signup-link"><a href="/login">Sign in instead</a></p>
        </form>
    </div>

</body>
</html>
